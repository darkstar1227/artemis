name: agent_service

on:
  push:
    branches: [ "main" ]
    paths:
      - "agent_service/**"
      - ".github/workflows/agent_service.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "agent_service/**"
      - ".github/workflows/agent_service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_service

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Import/syntax check
        run: uv run python -c "import main"
      - name: pytest (mock-LLM smoke tests)
        run: uv run pytest tests/ -v
      - name: pylint (service source only, not test fixtures)
        run: uv run pylint main.py tools.py agents_def.py pipeline.py schemas.py central.py
