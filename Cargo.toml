[package]
name = "artemis"
version = "0.1.0"
edition = "2021"
description = "Agent 版 autoheal — 即時偵測伺服器/專案執行期錯誤、記錄事件並交付根因分析報告"

[[bin]]
name = "artemis"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
sysinfo = "0.32"
ureq = { version = "2", features = ["json"] }
