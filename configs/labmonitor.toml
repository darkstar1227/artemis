# 由 `artemis onboard /Users/ds-anxing/cancerfree/labmonitor` 自動產生(專案類型:node)
# 偵測到 Node.js 專案,套件管理工具:pnpm

name = "labmonitor"
command = "pnpm dev"
cwd = "/Users/ds-anxing/cancerfree/labmonitor"

log_files = []
error_patterns = [
    "Error:",
    "ERROR",
    "Uncaught",
    "UnhandledPromiseRejection",
    "FATAL",
    "panic:",
    "Traceback \\(most recent call last\\)",
    "thread '.*' panicked at",
]

auto_restart = true
restart_delay_ms = 2000
max_restarts = 5

incidents_dir = "./incidents/labmonitor"
context_lines = 6
analyzer_script = "./analyzer/analyze.py"

[resources]
enabled = true
poll_interval_ms = 5000
cpu_percent = 90.0
memory_percent = 90.0
disk_percent = 90.0

[escalation]
enabled = true
verify_window_ms = 15000
health_check_command = "curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/"

stage1_allowed_tools = [
    "Bash(rm -rf .next)",
    "Bash(pkill -f 'next dev')",
]

stage3_config_files = [
    "/Users/ds-anxing/cancerfree/labmonitor/.env.local",
    "/Users/ds-anxing/cancerfree/labmonitor/vercel.json",
]

stage4_test_command = "pnpm typecheck && pnpm lint && pnpm test"

# 取代 Claude Code CLI 的 Python 服務(agent_service/,OpenAI Agents SDK):
# 判斷層與執行層都在這裡執行,偵測到事件時 Rust 會呼叫這個本機 HTTP 服務。
# 啟動方式:cd agent_service && uv run uvicorn main:app --port 8787
[agent_service]
url = "http://127.0.0.1:8787"
timeout_secs = 600

# 多模型 agent harness(選用):啟用後,偵測到事件時會先呼叫 orchestrator model
# (透過 LiteLLM 的 OpenAI-compatible API)動態決定要派哪些分析 agent,
# 彙整結果後才交給上面的 stage1~3 執行。預設關閉,設定好 LiteLLM endpoint 與
# 模型名稱後再手動開啟。
[orchestrator]
enabled = false
base_url = "http://localhost:4000/v1"
# api_key_env = "LITELLM_API_KEY"
model = "your-orchestrator-model"
timeout_secs = 60

[agents.risk_analysis]
model = "your-risk-analysis-model"

[agents.security_analysis]
model = "your-security-analysis-model"

[agents.quick_fix_analysis]
model = "your-quick-fix-analysis-model"

[agents.log_analysis]
model = "your-log-analysis-model"

[agents.root_cause_analysis]
model = "your-root-cause-analysis-model"
