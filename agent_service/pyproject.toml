[project]
name = "artemis-agent-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai-agents>=0.22.3",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pylint>=3.3.0",
    "pytest>=8.3.0",
]

[tool.pylint.main]
max-line-length = 110

[tool.pylint."messages control"]
# missing-*-docstring: this codebase deliberately writes no docstrings (names
# carry the "what", CLAUDE.md/comments carry the non-obvious "why" only).
# broad-exception-caught: several call sites intentionally catch Exception to
# degrade gracefully instead of ever blocking the pipeline (documented in
# CLAUDE.md) — that's a design choice, not an oversight pylint should flag.
# subprocess-run-check: every subprocess.run() here inspects returncode/stdout
# itself rather than wanting an exception on nonzero exit.
# too-many-instance-attributes: StageContext is one flat per-run permission
# scope (local + remote), splitting it into sub-objects would just move the
# same fields around, not reduce them.
# too-many-return-statements: remote_exec has one early return per distinct
# failure mode (unconfigured/denied/sanc unreachable/timeout) — each returns
# a specific, actionable message instead of a generic exception.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "broad-exception-caught",
    "subprocess-run-check",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-return-statements",
]
